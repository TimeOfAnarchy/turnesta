name: turnesta

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

x-app: &app
  image: ${TURNESTA_IMAGE:?Set the application image}
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging: *logging

x-runtime: &runtime
  DATABASE_URL: postgresql://turnesta_api:${TURNESTA_API_DB_PASSWORD:?required}@db:5432/turnesta
  TURNESTA_BIND_ADDR: 0.0.0.0:8080
  TURNESTA_PUBLIC_ORIGIN: https://${TURNESTA_DOMAIN:?required}
  TURNESTA_WEB_DIST: /app/web
  TURNESTA_TIPS_MODE: disabled
  TURNESTA_DELIVERY_KEY: ${TURNESTA_DELIVERY_KEY:?required}
  RUST_LOG: turnesta_api=info,sqlx=warn

services:
  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: turnesta
      POSTGRES_USER: turnesta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 20
    stop_grace_period: 30s
    logging: *logging

  db-bootstrap:
    image: postgres:18-bookworm
    user: postgres
    entrypoint: [psql, --no-psqlrc, --set=ON_ERROR_STOP=1, --file=/bootstrap/bootstrap.sql]
    environment:
      PGHOST: db
      PGDATABASE: turnesta
      PGUSER: turnesta
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TURNESTA_API_DB_PASSWORD: ${TURNESTA_API_DB_PASSWORD}
      TURNESTA_ADMIN_DB_PASSWORD: ${TURNESTA_ADMIN_DB_PASSWORD:?required}
      TURNESTA_MIGRATOR_DB_PASSWORD: ${TURNESTA_MIGRATOR_DB_PASSWORD:?required}
      TURNESTA_WORKER_DB_PASSWORD: ${TURNESTA_WORKER_DB_PASSWORD:?required}
    volumes:
      - ../scripts/db:/bootstrap:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *logging

  migrator:
    <<: *app
    command: [migrate]
    environment:
      <<: *runtime
      DATABASE_URL: postgresql://turnesta_migrator:${TURNESTA_MIGRATOR_DB_PASSWORD}@db:5432/turnesta
      TURNESTA_DB_MAX_CONNECTIONS: 1
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    restart: "no"

  api:
    <<: *app
    command: [serve]
    environment: *runtime
    depends_on:
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, curl, --fail, --silent, --show-error, --max-time, "2", http://127.0.0.1:8080/health/ready]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    stop_grace_period: 15s
    restart: unless-stopped

  worker:
    <<: *app
    profiles: [mail]
    command: [worker]
    environment:
      <<: *runtime
      DATABASE_URL: postgresql://turnesta_worker:${TURNESTA_WORKER_DB_PASSWORD}@db:5432/turnesta
      TURNESTA_DB_MAX_CONNECTIONS: 2
      TURNESTA_SMTP_HOST: ${TURNESTA_SMTP_HOST:-}
      TURNESTA_SMTP_PORT: ${TURNESTA_SMTP_PORT:-465}
      TURNESTA_SMTP_FROM: ${TURNESTA_SMTP_FROM:-}
      TURNESTA_SMTP_TLS_MODE: ${TURNESTA_SMTP_TLS_MODE:-smtps}
      TURNESTA_SMTP_USERNAME: ${TURNESTA_SMTP_USERNAME:-}
      TURNESTA_SMTP_PASSWORD: ${TURNESTA_SMTP_PASSWORD:-}
    depends_on:
      migrator:
        condition: service_completed_successfully
    stop_grace_period: 40s
    restart: unless-stopped

  admin:
    <<: *app
    profiles: [tools]
    environment:
      <<: *runtime
      DATABASE_URL: postgresql://turnesta_admin:${TURNESTA_ADMIN_DB_PASSWORD}@db:5432/turnesta
      TURNESTA_DB_MAX_CONNECTIONS: 1
    depends_on:
      migrator:
        condition: service_completed_successfully
    restart: "no"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      TURNESTA_DOMAIN: ${TURNESTA_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
