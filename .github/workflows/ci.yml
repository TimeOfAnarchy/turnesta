name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: turnesta-ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/web/tools/lint/package-lock.json
            e2e/package-lock.json

      - name: Frontend
        working-directory: apps/web
        run: |
          npm ci
          npm --prefix tools/lint ci
          npm run lint
          npm test
          npm run build

      - name: Deployment scripts
        run: |
          for script in scripts/common.sh scripts/install.sh scripts/update.sh scripts/backup.sh scripts/restore.sh scripts/purge.sh tests/deploy-update.test.sh tests/maintenance-lock.test.sh tests/backup-restore.test.sh tests/purge.test.sh; do sh -n "$script"; done
          sh tests/deploy-update.test.sh
          sh tests/maintenance-lock.test.sh
          sh tests/backup-restore.test.sh
          sh tests/purge.test.sh
          if command -v shellcheck >/dev/null; then
            shellcheck -s sh -x -P scripts scripts/common.sh scripts/install.sh scripts/update.sh scripts/backup.sh scripts/restore.sh scripts/purge.sh tests/deploy-update.test.sh tests/maintenance-lock.test.sh tests/backup-restore.test.sh tests/purge.test.sh
          fi

      - name: Start the stack
        run: |
          ./scripts/init-env.sh
          docker compose --env-file .env up --build --wait

      - name: Check OpenAPI snapshot and generated types
        working-directory: apps/web
        run: |
          npm run api:snapshot -- --check
          npm run api:types -- --check

      - name: Rust checks
        run: |
          docker build --target devtool --tag turnesta-devtool:local .
          docker run --rm \
            --mount type=volume,source=turnesta_cargo_registry,target=/usr/local/cargo/registry \
            --mount type=volume,source=turnesta_cargo_git,target=/usr/local/cargo/git \
            --mount type=volume,source=turnesta_target,target=/workspace/target \
            turnesta-devtool:local \
            sh -c 'cargo fmt --check && cargo clippy --workspace --all-targets --locked -- -D warnings && cargo test --workspace --locked'

      - name: Database tests
        run: node scripts/test-postgres.mjs

      - name: Browser tests
        working-directory: e2e
        run: |
          npm ci
          npx --no-install playwright install --with-deps chromium firefox webkit
          npm test

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Audit production npm dependencies
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high

      - name: Audit Rust dependencies
        if: ${{ !cancelled() }}
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  image:
    if: github.event_name == 'push'
    needs: [test, audit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build image for scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runtime
          load: true
          tags: turnesta:ci-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: turnesta:ci-${{ github.sha }}
          scanners: vuln
          format: table
          exit-code: '0'

      - name: Block fixable critical image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: turnesta:ci-${{ github.sha }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the scanned image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag "turnesta:ci-${{ github.sha }}" "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
