name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Frontend
        working-directory: apps/web
        run: |
          npm ci
          npm test
          npm run build

      - name: Start the stack
        run: |
          ./scripts/init-env.sh
          docker compose --env-file .env up --build --wait

      - name: Rust checks
        run: |
          docker build --target devtool --tag turnesta-devtool:local .
          docker run --rm \
            --mount type=volume,source=turnesta_cargo_registry,target=/usr/local/cargo/registry \
            --mount type=volume,source=turnesta_target,target=/workspace/target \
            turnesta-devtool:local \
            sh -c 'cargo fmt --check && cargo clippy --workspace --all-targets --locked -- -D warnings && cargo test --workspace --locked'

      - name: Database tests
        shell: pwsh
        run: ./scripts/Test-Postgres.ps1

  image:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
